<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIA · CSS fruit collection</title><link rel="stylesheet" href="../src/styles/app.css"><style>body{padding:50px 30px;max-width:1200px;margin:auto}h1{margin-bottom:15px}p{color:#75869d}.fruit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;margin-top:35px}.sample{padding:30px 20px;border:1px solid #e3e8ef;border-radius:8px;text-align:center;background:white}.art-stage{height:140px;display:flex;align-items:center;justify-content:center}.art-stage>.fruit{transform:scale(3)}.sample h2{font-size:15px;text-transform:capitalize;font-weight:500}.sample small{display:block;color:#8da0b8;margin-top:8px}a{display:inline-block;color:#1967d2;margin-top:25px}</style></head><body><div class="eyebrow">DIA DESIGN ASSETS</div><h1>CSS fruit collection</h1><p>Your supplied shapes, adapted for content illustrations and loading animations, with black silhouette outlines. Every shape is CSS; no images or emoji.</p><div id="collection" class="fruit-grid"></div><a href="../#dashboard">← Back to the DIA workspace</a><script type="module">import {fruit,fruitTypes} from '../src/core/ui.js';document.querySelector('#collection').innerHTML=[...fruitTypes,'yoghurt'].map(type=>`<section class="sample"><div class="art-stage">${fruit(type)}</div><h2>${type}</h2><small>Pure CSS illustration</small></section>`).join('');</script></body></html>
