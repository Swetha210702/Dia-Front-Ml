<!doctype html><html><head><meta charset="utf-8"><title>Document editor checks</title></head><body><h1>Document editor checks</h1><ol id="results"></ol><strong id="summary">Running…</strong><script type="module">
import {cleanRichText} from '../src/core/rich-text.js';
import {saveDocumentToPlan,printableDocument,setDocumentTitle} from '../src/core/document-editor.js';
import {newTable,tableProperties,applyTableProperties} from '../src/core/table-editor.js';
let passed=0,failed=0;
function test(name,fn){const item=document.createElement('li');try{fn();item.textContent='PASS · '+name;passed++}catch(error){item.textContent='FAIL · '+name+' · '+error.message;failed++}document.querySelector('#results').append(item)}
const assert=(condition,message)=>{if(!condition)throw Error(message)};
test('Pasted scripts, handlers and javascript links are removed',()=>{const html=cleanRichText('<script>throw Error()</scr'+'ipt><p onclick="bad()">Safe</p><a href="javascript:bad()">Bad link</a><img src="invalid" onerror="bad()">');assert(!/script|onclick|onerror|<img/i.test(html),'unsafe markup retained');assert(html.includes('Safe'),'safe text lost')});
test('Tables, small text, formatting and field markers survive round-trip sanitisation',()=>{const html=cleanRichText('<h2>Heading</h2><table class="report-table"><tbody><tr data-meal-row="0"><td><strong data-meal-field="name">Lunch</strong><small>1 PM</small></td></tr></tbody></table><p style="background-color:rgb(255,255,0);font-size:20px">Note</p>');assert(html.includes('<small>1 PM</small>'),'small text lost');assert(html.includes('data-meal-field="name"'),'field mapping lost');assert(html.includes('font-size: 20px'),'formatting lost')});
test('Safe document links and embedded images are preserved',()=>{const html=cleanRichText('<a href="https://example.com" onclick="bad()">Source</a><img src="data:image/png;base64,iVBORw0KGgo=" alt="Image">');assert(html.includes('rel="noopener noreferrer"'),'link security missing');assert(html.includes('data:image/png;base64,'),'image lost')});
test('Direct edits update plan metadata, meals, totals and full page content',()=>{const article=document.createElement('article');article.innerHTML='<h1 data-doc-field="name">Revised title</h1><p data-doc-field="instructions">Revised instructions</p><table><tbody><tr data-meal-row="0"><td><strong data-meal-field="name">Lunch</strong><small data-meal-field="time">1 PM</small></td><td><span data-meal-field="food">Rice</span><small data-meal-field="portion">1 bowl</small></td><td data-meal-field="calories">450</td></tr></tbody></table><div class="report-total"><strong>0 kcal</strong></div><p><b>Free custom paragraph</b></p>';const plan={name:'Old',status:'Draft',version:2,style:{},meals:[{food:'Old',calories:200}]};saveDocumentToPlan(article,plan);assert(plan.name==='Revised title','title not updated');assert(plan.meals[0].food==='Rice'&&plan.meals[0].calories===450,'meal edit not saved');assert(plan.documentHtml.includes('Free custom paragraph'),'custom paragraph lost');assert(plan.documentHtml.includes('450 kcal'),'total not recalculated')});
test('Deleting or reordering meal rows updates structured plan data',()=>{const article=document.createElement('article');article.innerHTML='<table><tbody><tr data-meal-row="1"><td data-meal-field="food">Dinner</td><td data-meal-field="calories">500</td></tr></tbody></table>';const plan={style:{},status:'Draft',version:1,meals:[{food:'Deleted',calories:100},{food:'Dinner',calories:500}]};saveDocumentToPlan(article,plan);assert(plan.meals.length===1&&plan.meals[0].food==='Dinner','deleted meal remains');assert(article.querySelector('tr').dataset.mealRow==='0','row indexes not normalised')});
test('Export HTML removes editing controls without losing document content',()=>{const html=printableDocument('<article contenteditable="true" data-document="true" role="textbox" aria-label="Diet plan document"><p>Custom document</p></article>');assert(!html.includes('contenteditable')&&!html.includes('data-document'),'editing controls leaked');assert(html.includes('Custom document'),'content lost')});
test('A title changed in page settings reaches saved pages and export content',()=>{const plan={name:'Old',documentPages:['<div class="report-title"><span class="report-kicker">PLAN</span><h1 data-doc-field="name">Old</h1></div>'],documentHtml:'<div class="report-title"><h1 data-doc-field="name">Old</h1></div>'};setDocumentTitle(plan,'New <title>');assert(plan.name==='New <title>','metadata not updated');assert(plan.documentPages[0].includes('New &lt;title&gt;'),'page title not updated or not escaped');assert(plan.documentHtml.includes('New &lt;title&gt;'),'export not updated')});
test('Title can be recovered after the document heading is removed',()=>{const plan={documentPages:['<div class="report-title"><span class="report-kicker">PLAN</span></div>']};setDocumentTitle(plan,'Recovered');assert(plan.documentPages[0].includes('data-doc-field="name"'),'title mapping not recovered')});
test('Zero table margins, padding and borders survive reopening properties',()=>{const host=document.createElement('div');host.className='sheet-body';host.innerHTML=newTable(3,3);document.body.append(host);const table=host.querySelector('table');applyTableProperties(table,{width:90,before:0,after:0,alignment:'left',indent:0,repeatHeader:true,rowHeight:32,borderWidth:0,borderStyle:'solid',borderColour:'#000000',fill:'#ffffff',headerFill:'#edf4ef',textAlign:'left',verticalAlign:'top',columnWidth:0,paddingTop:0,paddingRight:0,paddingBottom:0,paddingLeft:0});const dialog=document.createElement('div');dialog.innerHTML=tableProperties(table);for(const key of ['before','after','borderWidth','paddingTop','paddingLeft'])assert(Number(dialog.querySelector('[name="'+key+'"]').value)===0,key+' lost zero value');host.remove()});
document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed`;
</script></body></html>
