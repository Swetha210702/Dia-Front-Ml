<!doctype html><html><head><meta charset="utf-8"><title>Page and table checks</title><link rel="stylesheet" href="../src/styles/paged-editor.css"><style>body{font-family:Arial;margin:20px}.fixture{position:absolute;left:-4000px;top:0;width:900px}#results li{padding:5px}h1{font-size:22px}</style></head><body><h1>Page and table checks</h1><ol id="results"></ol><strong id="summary">Running…</strong><div id="fixture" class="fixture"></div><script type="module">
import {renderPages,paginateDocument,addDocumentPage,capturePages,pageDimensions} from '../src/core/paged-editor.js';
import {newTable,applyTableProperties} from '../src/core/table-editor.js';
import {cleanRichText} from '../src/core/rich-text.js';
import {printableDocument} from '../src/core/document-editor.js';
let passed=0,failed=0;const assert=(condition,message)=>{if(!condition)throw Error(message)};
const fixture=document.querySelector('#fixture');
function plan(html,style={}){return {style:{font:'Arial',size:14,colour:'#24574b',lineHeight:1.6,...style},documentPages:[html],meals:[],status:'Draft',version:1}}
function mount(p){fixture.innerHTML=renderPages(p,'');return fixture.querySelector('.sheet-body')}
function test(name,fn){const li=document.createElement('li');try{fn();li.textContent='PASS · '+name;passed++}catch(error){li.textContent='FAIL · '+name+' · '+error.message;failed++}document.querySelector('#results').append(li)}
await document.fonts.ready;
test('A4, Letter and Legal orientation dimensions follow paper sizes',()=>{assert(Math.abs(pageDimensions({}).height-1122.52)<.1,'incorrect A4 height');assert(pageDimensions({pageSize:'Legal',orientation:'Landscape'}).width===1344,'incorrect landscape dimensions')});
test('Inserted table has visible rows and columns, including empty cells',()=>{const p=plan(newTable(4,3));const body=mount(p),table=body.querySelector('table');assert(table.rows.length===4&&table.rows[0].cells.length===3,'wrong grid dimensions');assert(getComputedStyle(table.rows[1].cells[0]).borderTopWidth==='1px','borders missing');assert(table.rows[1].getBoundingClientRect().height>=32,'empty rows collapsed')});
test('Table margins, borders, widths and header settings survive sanitisation',()=>{const p=plan(newTable(4,3));const body=mount(p),table=body.querySelector('table');applyTableProperties(table,{width:85,alignment:'center',indent:0,before:4,after:5,borderWidth:2,borderStyle:'dashed',borderColour:'#007744',fill:'#ffffff',headerFill:'#ddffdd',paddingTop:2,paddingRight:3,paddingBottom:2,paddingLeft:4,textAlign:'center',verticalAlign:'middle',rowHeight:40,columnWidth:120,repeatHeader:true},1);const html=cleanRichText(table.outerHTML);const doc=new DOMParser().parseFromString(html,'text/html');const copy=doc.querySelector('table');assert(copy.style.width==='85%','width lost');assert(copy.querySelector('td').style.paddingLeft==='15.12px','cell margin lost');assert(copy.querySelector('td').style.border.includes('2px dashed'),'border style lost');assert(copy.dataset.repeatHeader==='true','header preference lost')});
test('Add page creates equal fixed-size sheets with anchored numbered footers',()=>{const p=plan('<p>First page</p>');mount(p);const next=addDocumentPage(p);next.textContent='Second page';paginateDocument(p);const sheets=[...fixture.querySelectorAll('.report-sheet')];assert(sheets.length===2,'page missing');assert(sheets[0].offsetHeight===sheets[1].offsetHeight,'page size differs');assert(getComputedStyle(sheets[1].querySelector('.sheet-footer')).position==='absolute','footer is flowing');assert(sheets[1].querySelector('.sheet-page-number').textContent==='2 / 2','numbering incorrect');capturePages(p);assert(p.documentPages.length===2&&p.documentManualBreaks[1]===true,'manual page not saved')});
test('Long table flows across pages, retains every row and repeats headers',()=>{const p=plan(newTable(60,3));mount(p);paginateDocument(p);const bodies=[...fixture.querySelectorAll('.sheet-body')],tables=[...fixture.querySelectorAll('table')];assert(bodies.length>1,'table did not paginate');assert(tables.reduce((sum,t)=>sum+t.tBodies[0].rows.length,0)===59,'rows lost or duplicated');assert(tables.every(t=>t.tHead?.rows.length===1),'header not repeated');assert(bodies.every(body=>body.scrollHeight<=body.clientHeight+2),'body overflows page')});
test('Long text flows onto further sheets without moving the footer',()=>{const p=plan('<p>'+('Sample paragraph content. '.repeat(700))+'</p>');mount(p);paginateDocument(p);const bodies=[...fixture.querySelectorAll('.sheet-body')];assert(bodies.length>1,'text did not paginate');assert(bodies.every(b=>b.scrollHeight<=b.clientHeight+2),'text overflows page');assert(bodies.map(b=>b.textContent).join('').match(/Sample paragraph content\./g).length===700,'text lost')});
test('Pageless mode grows naturally and exports omit upload controls',()=>{const p=plan('<p>'+('Long content '.repeat(500))+'</p>',{layout:'Pageless'});mount(p);paginateDocument(p);assert(fixture.querySelectorAll('.report-sheet').length===1,'pageless was split');const html=printableDocument(fixture.innerHTML);assert(!html.includes('Insert your logo')&&!html.includes('sheet-logo-button'),'logo controls leaked into export');assert(!html.includes('contenteditable='),'editing attributes leaked')});
test('Caret follows text to its new page after automatic pagination',()=>{const p=plan('<p>'+('Typing content. '.repeat(900))+'End token</p>');const body=mount(p);body.focus();const range=document.createRange();range.selectNodeContents(body);range.collapse(false);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);paginateDocument(p);assert(document.activeElement.classList.contains('sheet-body'),'editing focus lost');assert(document.activeElement.contains(selection.anchorNode),'caret left editable page');const before=document.createRange();before.selectNodeContents(document.activeElement);before.setEnd(selection.anchorNode,selection.anchorOffset);assert(before.toString().endsWith('End token'),'caret no longer follows text: '+JSON.stringify(before.toString().slice(-80)))});
test('Pageless combines existing pages without losing their content',()=>{const p=plan('<p>First</p>',{layout:'Pageless'});p.documentPages.push('<p>Second</p>');mount(p);assert(fixture.querySelectorAll('.report-sheet').length===1,'multiple pageless sheets');assert(fixture.textContent.includes('First')&&fixture.textContent.includes('Second'),'page content lost')});
fixture.remove();document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed`;
</script></body></html>
